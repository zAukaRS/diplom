<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои заявки</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs { margin-bottom: 20px; }
        .tab { padding: 8px 16px; cursor: pointer; background: #eee; display: inline-block; margin-right: 5px; }
        .tab.active { background: #4CAF50; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>Меню</h2>
        <ul>
            <li id="mainMenuLink"><a href="/home">🏠 Главная</a></li>
            <li><a href="/request_form">📝 Новая заявка</a></li>
            <li><a href="/my_requests">📋 Мои заявки</a></li>
            <li id="overtimeReportLink">📊 Отчёт по переработкам</li>
            <li><a href="/admin_management">👤 Управление админами</a></li>
            <li><a href="/moderate_requests">📋 Модерация заявок</a></li>
            <li id="themeToggleBtn" style="cursor: pointer;">🌓 Тёмная тема</li>
            <li><a href="#" onclick="logout(); return false;">🚪 Выход</a></li>
        </ul>
    </aside>
    <div class="main-content">
        <h1>Мои заявки</h1>
        <div class="tabs">
            <div class="tab active" data-type="drafts">Черновики</div>
            <div class="tab" data-type="approved">Одобренные</div>
        </div>
        <div id="requestsContainer">
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>Месторождение</th>
                        <th>Даты</th>
                        <th>Комментарий</th>
                        <th>Статус</th>
                        <th>Ответ админа</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
<script src="js/my_requests.js"></script>
</body>
</html>
